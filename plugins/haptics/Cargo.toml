[package]
name = "tauri-plugin-haptics"
description = "Haptic feedback and vibrations on Android, iOS and OpenHarmony"
version = "2.3.2"
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-haptics"

[package.metadata.docs.rs]
targets = ["x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }
openharmony = { level = "full", notes = "vibrate is time-based; impact/notification/selection feedback use documented vibrator presets, with a time-based fallback on devices lacking a preset" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
specta = { workspace = true, optional = true }

[target.'cfg(any(target_os = "ios", target_env = "ohos"))'.dependencies]
tauri = { workspace = true, features = ["wry"] }

[features]
specta = ["dep:specta", "tauri/specta"]
