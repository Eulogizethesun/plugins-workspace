[package]
name = "tauri-plugin-nfc"
version = "2.3.5"
description = "Read and write NFC tags on Android and iOS."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-nfc"

[package.metadata.docs.rs]
targets = ["x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }
openharmony = { level = "partial", notes = "is_available/scan/write via NFC readerMode foreground dispatch (Android Session semantics); the required `ohos.permission.NFC_TAG` (normal, system-granted) is declared by the plugin's OpenHarmony HAR module and granted App-wide, so consuming apps need no extra declaration; mimeType/uri scan filters have no platform equivalent and are ignored; the Rust-side API is not usable today — Nfc::write() is blocked by a kind contract mismatch (Rust's WriteRequest carries no `kind` field, and the ArkTS side only accepts kind-less writes against a tag stored by a prior keepSessionAlive scan) while Nfc::scan() is blocked by the Rust ScanResponse model (tag-nested, scalar id/kind) not matching the flat response the plugin returns — use the JS plugin API on all platforms" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde_repr = "0.1"

[target.'cfg(any(target_os = "ios", target_env = "ohos"))'.dependencies]
tauri = { workspace = true, features = ["wry"] }
