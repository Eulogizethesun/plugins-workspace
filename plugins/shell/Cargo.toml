[package]
name = "tauri-plugin-shell"
version = "2.3.5"
description = "Access the system shell. Allows you to spawn child processes and manage files and URLs using their default application."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-shell"

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "partial", notes = "Only allows to open URLs via `open`" }
ios = { level = "partial", notes = "Only allows to open URLs via `open`" }
openharmony = { level = "partial", notes = "Child process spawning works via std; the deprecated `open` API opens URLs/paths with the system default application through the openharmony-ability bridge (`with` is ignored; `mailto:`/`tel:` are rejected by the bridge, which requires a `://` scheme)." }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }
schemars = { workspace = true }
serde = { workspace = true }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tokio = { version = "1", features = ["time"] }
log = { workspace = true }
thiserror = { workspace = true }
shared_child = "1"
regex = "1"
encoding_rs = "0.8"
os_pipe = "1"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }

[target.'cfg(target_env = "ohos")'.dependencies]
openharmony-ability-plugin-url = { path = "../../../openharmony-ability/crates/plugin-url" }
url = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
tauri = { workspace = true, features = ["wry"] }
