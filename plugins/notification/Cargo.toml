[package]
name = "tauri-plugin-notification"
version = "2.3.3"
description = "Send desktop and mobile notifications on your Tauri application."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-notification"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-linux-android"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "Only works for installed apps. Shows powershell name & icon in development." }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "full", notes = "" }
ios = { level = "full", notes = "" }
openharmony = { level = "partial", notes = "Text/long/multiline notifications, permissions, channels (emulated over 4 system slot types), action buttons with actionPerformed click events (received-events not emitted; buttons are text-only; needs the EntryAbility wiring shipped in the tauri-cli open-harmony template); active() always returns an empty list. Scheduling publishes reminderAgentManager system reminders that fire while the app is backgrounded or killed (at, interval, every day/week/month/year); a one-shot `at` already due fires immediately, while schedules with no reminder equivalent (every hour/minute/second/twoWeeks, every with count > 1, past repeating dates, expired interval rules, interval rules mixing month/day with weekday) reject; reminders are quota-managed — the AGC agent-reminder entitlement and the `PUBLISH_AGENT_REMINDER` permission are required." }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
rand = "0.9"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
url = { version = "2", features = ["serde"] }
serde_repr = "0.1"

[target.'cfg(any(target_os = "ios", target_env = "ohos"))'.dependencies]
tauri = { workspace = true, features = ["wry"] }

[target."cfg(windows)".dependencies]
win7-notifications = { version = "0.4.5", optional = true }
windows-version = { version = "0.1", optional = true }

[target."cfg(all(any(target_os = \"macos\", windows, target_os = \"linux\", target_os = \"dragonfly\", target_os = \"freebsd\", target_os = \"openbsd\", target_os = \"netbsd\"), not(target_env = \"ohos\")))".dependencies]
notify-rust = "4.11"

[features]
windows7-compat = ["win7-notifications", "windows-version"]
