[package]
name = "tauri-plugin-process"
version = "2.3.1"
description = "Access the current process of your Tauri application."
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }
repository = { workspace = true }
links = "tauri-plugin-process"

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }
openharmony = { level = "full", notes = "exit() supported, but the exit code is not propagated (process always exits 0; the code is only delivered on RunEvent::ExitRequested); restart() goes through app.request_restart() (RunEvent::Exit) and relaunches via ApplicationContext.restartApp() (API 12+; kills all app processes, onDestroy not fired) and requires the app to be in the foreground — a background restart is rejected (error 16000053, logged as \"Not top ability\") and the app exits without relaunching, which cannot be observed from JS" }

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
tauri = { workspace = true }
log = { workspace = true }
